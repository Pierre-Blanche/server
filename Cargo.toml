[package]
name = "pierre_blanche_server"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "pierre_blanche_server"
path = "src/main.rs"

[dependencies.tiered_server]
#path = "../tiered_server"
git = "https://github.com/programingjd/tiered_server.git"
branch = "main"

[dependencies.tracing-subscriber]
version = "0.3"
features = ["env-filter"]

[dependencies.tracing]
version = "0.1"
default-features = false
features = ["std"]

[dependencies.tokio]
version = "1.53"
default-features = false
features = ["rt", "rt-multi-thread"]

[dependencies.tokio-rustls]
version = "0.26"
default-features = false
features = ["ring"]

[dependencies.hyper]
version = "1.11"
default-features = false
features = []

[dependencies.reqwest]
version = "0.13"
default-features = false
features = ["blocking", "rustls-no-provider", "multipart", "form", "json", "deflate", "gzip", "brotli", "zstd", "http2"]

[dependencies.http-body-util]
version = "0.1"
default-features = false
features = []

[dependencies.pinboard]
version = "2.2"
default-features = false
features = []

[dependencies.scraper]
version = "0.27"
default-features = false
features = []

[dependencies.serde]
version = "1.0"
default-features = false
features = ["std", "derive"]

[dependencies.serde_json]
version = "1.0"
default-features = false
features = ["std", "preserve_order"]

[dependencies.fastrand]
version = "2.4"
default-features = false
features = ["std", "getrandom"]

[dev-dependencies.chrono]
version = "0.4"
default-features = false
features = ["std"]

[profile.release]
lto = "fat"
codegen-units = 1
